const W=320,H=200,FOV=Math.PI/3,MW=75,MH=15,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const NOTES=["Patient 14. Ils disent que les murs sont plats. Pourtant Le Ventre respire quand je ne le regarde pas.","Ne fixe jamais Le Cube. Il est patient. Il a tout son temps, et toi non.","L’Esquisse n’obéit à aucune règle. Hier elle était au réfectoire, une seconde plus tard derrière moi.","Trois reliques ferment le cercle. Trois reliques ouvrent la porte de service.","Les armoires m’ont sauvé deux fois. Mais pas quand l’une d’elles passe dessus."];
const NAMES={V:"Le Ventre",C:"Le Cube",E:"L’Esquisse",M:"Un médecin"};
let bat=100,lampOn=true,cut=0,scare=null,scares=[],doors=[],san=100,cineT=0,cineB=0,cineTxt='',ambT=50,LK=.25,map,P,items,mons,open,relics,elapsed,state='title',msg='',msgT=0,hidden=null,hint='',zb=new Float32Array(W),keys={},dp,dpKey='',beatT=0,AC,ai=false;

/* ---------- audio ---------- */
function beep(f,v,d,ty){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
function beat(v){beep(55,.6*v,.18);setTimeout(()=>beep(46,.4*v,.2),160)}
function noise(d,v){if(!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start()}
function jump(ty){fright(ty=='face'?14:ty=='dark'?9:6);
  if(ty=='face'){scare={t:.55,k:['V','C','E'][rnd(3)]};noise(.5,.7);beep(1400,.25,.4,'sawtooth');beep(70,.8,.6,'sawtooth')}
  else if(ty=='dark'){cut=3.2;noise(.25,.6);beep(55,.9,.5,'square');flash('La lampe s’est éteinte toute seule.')}
  else{scare={t:.25,k:null};noise(.6,.5);beep(900,.2,.6,'square')}
}

/* ---------- labyrinthe ---------- */
function hospital2(){
  map=Array.from({length:MH},()=>Array(MW).fill(1));doors=[];
  const cv_=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)map[y][x]=0};
  cv_(1,6,MW-2,8);
  for(const[y0,y1,dy]of[[1,4,5],[10,13,9]]){
    let x=1;
    for(;;){
      let x1=x+2+rnd(2);if(MW-2-x1<3)x1=MW-2;
      cv_(x,y0,x1,y1);
      const dx=x+((x1-x)>>1);map[dy][dx]=2;doors.push({x:dx,y:dy});
      if(x1>=MW-2)break;
      if(Math.random()<.3){const yy=y0+1+rnd(y1-y0-1);map[yy][x1+1]=2;doors.push({x:x1+1,y:yy})}
      x=x1+2;
    }
  }
  for(let i=0;i<10;i++)map[7][4+rnd(MW-8)]=1;
  for(let x=1;x<MW-1;x++)if(x%3==1){if(!map[1][x])map[0][x]=3;if(!map[MH-2][x])map[MH-1][x]=3}
  for(let y=6;y<=8;y++){map[y][0]=3;map[y][MW-1]=3}
}
function hospital(){hospital2();return;
  map=Array.from({length:MH},()=>Array(MW).fill(1));
  const cv_=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)map[y][x]=0};
  cv_(1,8,MW-2,10);
  for(const[y0,y1,dy]of[[1,6,7],[12,19,11]]){
    let x=1;
    for(;;){
      let x1=x+3+rnd(4);if(MW-2-x1<4)x1=MW-2;
      cv_(x,y0,x1,y1);
      const dx=x+((x1-x)>>1);map[dy][dx]=0;if(x1-x>=4)map[dy][dx+1]=0;
      if(x1>=MW-2)break;
      if(Math.random()<.4)map[y0+1+rnd(y1-y0-1)][x1+1]=0;
      x=x1+2;
    }
  }
  for(let i=0;i<5;i++)map[9][4+rnd(MW-8)]=1;
}
function corner(c){const o=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>!map[c.y+b][c.x+a]);return o.length==2&&(o[0][0]!=0)!=(o[1][0]!=0)}
function gen(){hospital();return;
  map=Array.from({length:N},()=>Array(N).fill(1));
  const st=[[1,1]];map[1][1]=0;
  while(st.length){
    const[c,r]=st[st.length-1];
    const d=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>{const x=c+a,y=r+b;return x>0&&y>0&&x<N-1&&y<N-1&&map[y][x]}).sort(()=>Math.random()-.5);
    if(!d.length){st.pop();continue}
    const[a,b]=d[0];map[r+b/2][c+a/2]=0;map[r+b][c+a]=0;st.push([c+a,r+b]);
  }
  for(let k=0;k<16;k++){const x=1+rnd(N-2),y=1+rnd(N-2);if(map[y][x]&&(x+y)%2==1)map[y][x]=0}
}
function dmap(tx,ty){
  const d=Array.from({length:MH},()=>Array(MW).fill(-1)),q=[[tx,ty]];d[ty][tx]=0;
  for(let i=0;i<q.length;i++){const[x,y]=q[i];for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+a,Y=y+b;if(map[Y]&&(map[Y][X]===0||map[Y][X]===2)&&d[Y][X]<0){d[Y][X]=d[y][x]+1;q.push([X,Y])}}}
  return d;
}

/* ---------- nouvelle partie ---------- */
function newGame(){
  gen();relics=0;elapsed=0;hidden=null;msg='';dpKey='';beatT=1;bat=100;san=100;lampOn=true;cut=0;scare=null;ambT=40+rnd(40);
  const ds=dmap(2,7);open=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(!map[y][x])open.push({x,y,d:ds[y][x]});
  const far=open.filter(c=>c.d>8).sort(()=>Math.random()-.5);
  const exit=open.reduce((a,b)=>b.d>a.d?b:a);
  const used=new Set([exit.x+','+exit.y,'2,7']);
  const pick=min=>{const c=far.find(c=>c.d>=min&&!used.has(c.x+','+c.y))||open[rnd(open.length)];used.add(c.x+','+c.y);return c};
  const cen=c=>({x:c.x+.5,y:c.y+.5});
  items=[{...cen(exit),t:'D',k:.95}];
  for(let i=0;i<3;i++)items.push({...cen(pick(7)),t:'R',k:.4,hv:.3});
  const dead=open.filter(c=>c.d>3&&[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>!map[c.y+b][c.x+a]).length==2&&corner(c)&&!used.has(c.x+','+c.y)).sort(()=>Math.random()-.5);
  for(let i=0;i<Math.min(6,dead.length);i++){used.add(dead[i].x+','+dead[i].y);items.push({...cen(dead[i]),t:'W',k:.85})}
  NOTES.forEach((_,i)=>items.push({...cen(pick(3)),t:'N',k:.28,n:i}));
  for(let i=0;i<10;i++)items.push({...cen(pick(2)),t:'B',k:.22});
  scares=[];['face','dark','face','noise','dark'].forEach(ty=>{const c=pick(5);scares.push({x:c.x+.5,y:c.y+.5,ty,done:0})});
  mons=['V','C','E'].map(t=>{const c=cen(pick(10));return{...c,tx:c.x,ty:c.y,t,k:.95,hv:t=='E'?0:.15,sp:1,tm:0,tp:6,wait:0}});
  for(let i=0;i<5;i++){const cs=open.filter(c=>c.y>=6&&c.y<=8&&c.x>8),c=cen(cs[rnd(cs.length)]);mons.push({...c,tx:c.x,ty:c.y,t:'M',k:.95,sp:.9,tm:0,tp:6,wait:0})}
  P={x:2.5,y:7.5,a:0};
}

/* ---------- textures ---------- */
function mk(f){const c=document.createElement('canvas');c.width=c.height=64;f(c.getContext('2d'));return c}
const SP={
V:mk(()=>{}),
C:mk(()=>{}),
E:mk(()=>{}),
W:mk(g=>{g.fillStyle='#3a2a1c';g.fillRect(12,2,40,60);g.fillStyle='#2b1f14';g.fillRect(16,6,15,52);g.fillRect(33,6,15,52);g.fillStyle='#a89060';g.fillRect(28,32,2,7);g.fillRect(34,32,2,7)}),
R:mk(g=>{const r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'#fff6c0');r.addColorStop(.4,'#e0a82e66');r.addColorStop(1,'#0000');g.fillStyle=r;g.fillRect(0,0,64,64);g.fillStyle='#ffe38a';g.beginPath();g.moveTo(32,14);g.lineTo(44,32);g.lineTo(32,50);g.lineTo(20,32);g.fill()}),
N:mk(g=>{g.fillStyle='#d8d0b4';g.fillRect(16,12,32,40);g.fillStyle='#8a8268';for(let i=0;i<6;i++)g.fillRect(20,18+i*6,24-(i%3)*4,2)}),
B:mk(g=>{g.fillStyle='#2b7a3a';g.fillRect(22,18,20,34);g.fillStyle='#c9c9c9';g.fillRect(28,12,8,6);g.fillStyle='#e3b341';g.fillRect(22,26,20,6)}),
D:mk(g=>{g.fillStyle='#1c2b22';g.fillRect(10,2,44,62);g.fillStyle='#294a36';g.fillRect(15,6,34,56);g.fillStyle='#7ee0a0';g.fillRect(38,32,4,4)})
};
function scribble(){
  const g=SP.E.getContext('2d');g.clearRect(0,0,64,64);g.strokeStyle='#e8e4d8';g.lineWidth=1.5;
  for(let k=0;k<3;k++){g.beginPath();for(let i=0;i<15;i++){const a=i*.45,r=5+i*1.7;g.lineTo(32+Math.cos(a)*r*.9+(Math.random()-.5)*5,30+Math.sin(a)*r+(Math.random()-.5)*5)}g.stroke()}
  g.fillStyle='#e8e4d8';g.fillRect(23+rnd(3),20,3,3);g.fillRect(38+rnd(3),20,3,3);

/* ---------- IA des créatures ---------- */
function los(m,R){
  const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy);if(d>R)return false;
  for(let s=0;s<d;s+=.1)if(map[(m.y+dy/d*s)|0][(m.x+dx/d*s)|0])return false;
  return true;
}
function pickNext(m,dm){
  const x=m.x|0,y=m.y|0;
  let ns=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[x+a,y+b]).filter(([X,Y])=>map[Y][X]===0||map[Y][X]===2);if(m.t=='M'&&!m.mon){const f=ns.filter(([X,Y])=>Y>=6&&Y<=8);if(f.length)ns=f}
  let n;
  if(m.chase&&dm){n=ns.reduce((a,b)=>dm[b[1]][b[0]]<dm[a[1]][a[0]]?b:a)}
  else{const f=ns.filter(([X,Y])=>!(m.pc&&X==m.pc[0]&&Y==m.pc[1]));const l=f.length?f:ns;n=l[rnd(l.length)]}
  if(map[n[1]][n[0]]==2){map[n[1]][n[0]]=0;if(Math.hypot(n[0]+.5-P.x,n[1]+.5-P.y)<9)beep(170,.25,.35,'sawtooth')}
  m.pc=[x,y];m.tx=n[0]+.5;m.ty=n[1]+.5;
}
function tele(m){
  const c=open.filter(c=>dp[c.y][c.x]>5),p=c[rnd(c.length)];
  if(p){m.x=p.x+.5;m.y=p.y+.5;m.tx=m.x;m.ty=m.y;beep(1500,.06,.12,'square')}
}
function upMons(dt){
  const pc=[P.x|0,P.y|0],k=pc.join();
  if(k!=dpKey){dpKey=k;dp=dmap(pc[0],pc[1])}
  for(const m of mons){
    const mc=[m.x|0,m.y|0],d=dp[mc[1]][mc[0]];let dm=dp;
    if(m.t=='V'){m.chase=!hidden&&d<7;m.sp=m.chase?2.6:1.2}
    else if(m.t=='M'){
      if(m.mon){m.life-=dt;if(m.life<=0){m.dead=1;fright(8);scare={t:.55,k:'X'};noise(.5,.7);beep(1400,.25,.4,'sawtooth');beep(70,.8,.6,'sawtooth');continue}}
      if(m.mon===undefined&&!hidden&&Math.hypot(m.x-P.x,m.y-P.y)<2.4&&los(m,3)){m.mon=Math.random()<.2;if(m.mon){m.life=5;fright(12);scare={t:.5,k:'X'};noise(.5,.7);beep(1400,.25,.4,'sawtooth');beep(70,.8,.6,'sawtooth');flash('Ce n’est pas un médecin.')}}
      m.chase=!!m.mon&&!hidden&&d<10;m.sp=m.mon?(m.chase?2.1:1.2):.9}
    else if(m.t=='C'){
      if(!hidden&&los(m,12)){if(!m.seen)beep(110,.3,.7,'sawtooth');m.seen=pc;m.dm=dp}
      if(m.seen&&mc[0]==m.seen[0]&&mc[1]==m.seen[1]){m.seen=null;m.wait=3}
      if(m.wait>0)m.wait-=dt;
      m.chase=!!m.seen;m.sp=m.wait>0?0:(m.chase?1.7:.7);dm=m.dm;
    }else{
      m.tm-=dt;if(m.tm<0){m.tm=1+Math.random()*2;m.sp=.6+Math.random()*2.2;m.chase=Math.random()<.4||(!hidden&&d<4)}
      m.tp-=dt;if(m.tp<0){m.tp=6+Math.random()*7;tele(m)}
    }
    if(m.sp>0){
      const dx=m.tx-m.x,dy=m.ty-m.y,dist=Math.hypot(dx,dy),s=m.sp*dt;
      if(dist<=s){m.x=m.tx;m.y=m.ty;pickNext(m,dm)}else{m.x+=dx/dist*s;m.y+=dy/dist*s}
    }
  }
}

/* ---------- mise à jour ---------- */
function mv(dx,dy){
  const r=.22;
  if(!map[P.y|0][(P.x+dx+Math.sign(dx)*r)|0])P.x+=dx;
  if(!map[(P.y+dy+Math.sign(dy)*r)|0][P.x|0])P.y+=dy;
}
function flash(t){msg=t;msgT=2.6}
function update(dt){
  elapsed+=dt;if(msgT>0)msgT-=dt;
  if(cut>0)cut-=dt;else if(lampOn&&bat>0){bat=Math.max(0,bat-.5*dt);if(bat==0)flash('La lampe est morte. Cherche des piles.')}
  if(scare)scare.t-=dt;
  ambT-=dt;if(ambT<0){ambT=45+rnd(50);jump(['noise','dark','face'][rnd(3)])}
  for(const sc of scares)if(!sc.done&&!hidden&&Math.hypot(sc.x-P.x,sc.y-P.y)<1.3){sc.done=1;jump(sc.ty)}
  if(ai)aiStep(dt);
  else if(!hidden){
    const f=(keys.f?1:0)-(keys.b?1:0),sp=2.1*dt;
    if(f)mv(Math.cos(P.a)*f*sp,Math.sin(P.a)*f*sp);
    P.a+=((keys.r?1:0)-(keys.l?1:0))*2.2*dt;
  }
  hint=hidden?'E : sortir de l’armoire':'';
  for(const it of items){
    if(it.gone)continue;
    const d=Math.hypot(it.x-P.x,it.y-P.y);
    if(it.t=='R'&&d<.6){it.gone=1;relics++;flash('Relique '+relics+' sur 3');beep(660,.3,.5)}
    if(it.t=='B'&&d<.6){it.gone=1;bat=Math.min(100,bat+40);flash('Pile trouvée. La lampe se recharge.');beep(440,.25,.3)}
    if(it.t=='D'&&d<.7&&!hidden){if(relics>=3)return end(true);flash('La porte est scellée. Il manque des reliques.')}
    if(!hidden&&d<.9){if(it.t=='W')hint='E : se cacher';if(it.t=='N')hint='E : lire'}
  }
  if(!hidden&&!hint){const dd=doorAt();if(dd)hint=map[dd.y][dd.x]==2?'E : ouvrir la porte':'E : fermer la porte'}
  upMons(dt);mons=mons.filter(m=>!m.dead);
  let nd=99;
  for(const m of mons){
    const d=Math.hypot(m.x-P.x,m.y-P.y);
    if(d<(hidden?.9:.55)&&!m.dead&&(m.t!='M'||m.mon)){
      if(ai&&aiDodge(m))continue;
      return end(false,m);
    }
    if(m.t=='V'&&d>3.5)continue;
    nd=Math.min(nd,d);
  }
  beatT-=dt;
  if(beatT<=0){beat(Math.max(.15,Math.min(1,1.2-nd/10)));beatT=Math.max(.45,Math.min(1.6,.4+nd*.12))}
  $('dng').style.opacity=Math.max(0,Math.min(.85,1-nd/7));
}
function doorAt(){
  let best=null,bd=1.4;
  for(const d of doors){const dx=d.x+.5-P.x,dy=d.y+.5-P.y,dd=Math.hypot(dx,dy);if(dd>=bd)continue;let a=Math.atan2(dy,dx)-P.a;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)<.9){bd=dd;best=d}}
  return best;
}
function toggleDoor(d){
  if(map[d.y][d.x]==2){map[d.y][d.x]=0;beep(150,.3,.3,'sawtooth');return}
  if(Math.hypot(d.x+.5-P.x,d.y+.5-P.y)<.7||mons.some(m=>Math.hypot(m.x-d.x-.5,m.y-d.y-.5)<.8)){flash('Quelque chose bloque la porte.');return}

function toggleLamp(){if(state!='play')return;if(bat<=0){flash('Plus de batterie.');return}lampOn=!lampOn;beep(1000,.1,.05,'square')}

/* ---------- IA (monstres mortels : esquive, cache, sprint) ---------- */
let aiHt=0,aiCd=0,aiWait=0,aiDodgeCd=0,aiEscPath=null,aiEscT=0,aiDmCache={},aiNd=99;
function aiThreats(){return mons.filter(m=>!m.dead&&(m.t!='M'||m.mon))}
function aiPts(th){
  const pts=[];
  for(const m of th){
    if(m.t=='V'){pts.push([m.x,m.y,8.6,40]);pts.push([m.tx,m.ty,3,40])}
    else if(m.t=='E'){pts.push([m.x,m.y,3,90]);pts.push([m.tx,m.ty,2.2,90])}
    else{pts.push([m.x,m.y,2.4,110]);pts.push([m.tx,m.ty,2,110])}
  }
  for(const m of mons)if(!m.dead&&m.t=='M'&&!m.mon)pts.push([m.x,m.y,3.2,150]);
  return pts;
}
function aiOpen2(X,Y){
  let n=0;const seen={};seen[Y*100+X]=1;const q=[[X,Y,0]];
  while(q.length){const[A,B,D]=q.shift();n++;
    if(D<2)for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const c=map[B+b][A+a],k=(B+b)*100+A+a;
      if((c===0||c===2)&&!seen[k]){seen[k]=1;q.push([A+a,B+b,D+1])}}}
  return n;
}
function aiSafeHide(w,th){
  for(const m of th){
    if(Math.hypot(m.x-w.x,m.y-w.y)<1.5)return false;
    if(m.chase&&Math.hypot(m.tx-w.x,m.ty-w.y)<1.6)return false;
    if(m.t=='C'&&m.chase&&m.dm){const a=m.dm[w.y|0][w.x|0],b=m.dm[m.y|0][m.x|0];if(a>=0&&b>=0&&a<=b+.5)return false}
  }
  return true;
}
function aiTarget(t){
  const list=items.filter(it=>!it.gone&&it.t==t);
  if(!list.length)return null;
  list.sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y));
  const v=mons.find(m=>!m.dead&&m.t=='V');
  if(v&&list.length>1&&Math.hypot(list[0].x-v.x,list[0].y-v.y)<7.5)return list[1];
  return list[0];
}
function aiTurn(gx,gy,dt,go,sp){
  const da=Math.atan2(gy-P.y,gx-P.x)-P.a,ang=Math.atan2(Math.sin(da),Math.cos(da));
  let nt=1e9;for(const o of aiThreats())nt=Math.min(nt,Math.hypot(o.x-P.x,o.y-P.y));
  const tol=nt<3?.8:.3;
  if(Math.abs(ang)>tol){P.a+=Math.sign(ang)*Math.min(2.8*dt,Math.abs(ang));return}
  P.a+=ang;
  if(go)mv(Math.cos(P.a)*sp*dt,Math.sin(P.a)*sp*dt);
}
function aiNav(dt,dm,pts,th,allowWait){
  const px=P.x|0,py=P.y|0,ns=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[px+a,py+b]).filter(([X,Y])=>map[Y][X]===0||map[Y][X]===2);
  if(!ns.length)return;
  const cur=dm[py][px];
  const vNear=th.some(m=>m.t=='V'&&Math.hypot(m.x-P.x,m.y-P.y)<8.6);
  let cands=ns.filter(([X,Y])=>dm[Y][X]>=0&&(cur<0||dm[Y][X]<cur));
  if(vNear)cands=ns.filter(([X,Y])=>dm[Y][X]>=0);
  if(!cands.length)cands=ns;
  let best=null,bv=1e9;
  for(const[X,Y]of cands){
    let v=dm[Y][X]*(vNear?.45:1);
    for(const[qx,qy,r,w]of pts){const md=Math.hypot(qx-X-.5,qy-Y-.5);if(md<r)v+=(r-md)*w}
    const o2=aiOpen2(X,Y);
    if(o2<6)v+=(6-o2)*(vNear?1.5:.6);
    if(v<bv){bv=v;best=[X,Y]}
  }
  if(allowWait&&aiWait<6){
    let danger=false;
    for(const m of th)if(!m.chase&&Math.hypot(m.x-best[0]-.5,m.y-best[1]-.5)<2.3)danger=true;
    if(danger){aiWait+=dt;return}
  }
  aiWait=0;
  let sp=2.1;
  for(const m of th)if(Math.hypot(m.x-P.x,m.y-P.y)<5){sp=3.4;break}
  aiTurn(best[0]+.5,best[1]+.5,dt,true,sp);
  const dd=doorAt();
  if(dd&&map[dd.y][dd.x]==2&&Math.hypot(dd.x+.5-P.x,dd.y+.5-P.y)<1.2)toggleDoor(dd);
}
function aiPlan(dt,th){
  aiEscT-=dt;
  const px=P.x|0,py=P.y|0;
  let unsafe=false;
  if(aiEscPath&&aiEscPath.length){
    for(let i=0;i<Math.min(3,aiEscPath.length);i++){
      const[cx,cy]=aiEscPath[i];
      for(const m of th)if(Math.hypot(m.x-cx-.5,m.y-cy-.5)<1)unsafe=true;
    }
  }
  if(aiEscT<=0||!aiEscPath||!aiEscPath.length||unsafe){
    const seen={},par={},q=[[px,py,0]];seen[py*100+px]=1;
    const dms=th.map(m=>{const k=(m.x|0)+'_'+(m.y|0);if(!aiDmCache[k])aiDmCache[k]=[dmap(m.x|0,m.y|0),m.t=='V'?2.6:m.t=='C'?1.7:m.t=='E'?2.8:m.mon?2.1:.9];return aiDmCache[k]});
    const openQ=[];
    for(let y=1;y<map.length-1;y++)for(let x=1;x<map[0].length-1;x++){
      if(map[y][x]!==0&&map[y][x]!==2)continue;
      let n=0;
      for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const c=map[y+b][x+a];if(c===0||c===2)n++}
      if(n>=3||aiOpen2(x,y)>=9)openQ.push([x,y,0]);
    }
    const dOpen=Array.from({length:map.length},()=>Array(map[0].length).fill(99));
    for(const[x,y,d]of openQ)dOpen[y][x]=0;
    for(let i=0;i<openQ.length;i++){const[x,y,d]=openQ[i];
      for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+a,Y=y+b;
        if((map[Y][X]===0||map[Y][X]===2)&&dOpen[Y][X]>d+1){dOpen[Y][X]=d+1;openQ.push([X,Y,d+1])}}}
    let obj=null;
    if(bat<30)obj=aiTarget('B');
    if(!obj&&relics<3)obj=aiTarget('R');
    if(!obj)obj=items.find(it=>!it.gone&&it.t=='D')||null;
    const dmo=obj?dmap(obj.x|0,obj.y|0):null,dc=dmo?dmo[py][px]:0;

    while(q.length){
      const[X,Y,D]=q.shift();

      for(let i2=0;i2<th.length;i2++){
        const v=dms[i2][0][Y][X];
        if(v>=0)margin=Math.min(margin,v/dms[i2][1]-D/3.6);
      }
      if(margin>2.5)margin=2.5;
      let danger=0;
      for(const m of th){const ed=Math.hypot(m.x-X-.5,m.y-Y-.5);if(ed<1.4)danger+=(1.4-ed)*30}
      for(const m of mons)if(!m.dead&&m.t=='M'&&!m.mon){const ed=Math.hypot(m.x-X-.5,m.y-Y-.5);if(ed<3)danger+=(3-ed)*6}
      let conn=0;
      for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const c=map[Y+b][X+a];if(c===0||c===2)conn++}
      const gain=dmo&&dmo[Y][X]>=0&&dc>=0?dc-dmo[Y][X]:0;
      const vNear2=th.some(m=>m.t=='V'&&Math.hypot(m.x-P.x,m.y-P.y)<8);
      const score=margin*10+gain*3+D*.05+conn*.3+Math.min(aiOpen2(X,Y),12)*.2-danger-Math.max(0,dOpen[Y][X]-2)*(vNear2?4:2);

      for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const X2=X+a,Y2=Y+b,k=Y2*100+X2;

    }
    let path=[],cur=best;
    while(cur&&!(cur[0]===px&&cur[1]===py)){path.unshift(cur);cur=par[cur[1]*100+cur[0]]}

  }
  while(aiEscPath.length&&Math.hypot(aiEscPath[0][0]+.5-P.x,aiEscPath[0][1]+.5-P.y)<.35)aiEscPath.shift();
  const tgt=aiEscPath[0];
  if(tgt){
    P.a=Math.atan2(tgt[1]+.5-P.y,tgt[0]+.5-P.x);
    mv(Math.cos(P.a)*3.6*dt,Math.sin(P.a)*3.6*dt);
    const dd=doorAt();
    if(dd&&map[dd.y][dd.x]==2&&Math.hypot(dd.x+.5-P.x,dd.y+.5-P.y)<1.2)toggleDoor(dd);
  }
}
function aiDodge(m){
  if(aiDodgeCd>0)return false;
  const th=aiThreats();
  let best=null,bv=-1;
  for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const X=(P.x|0)+a,Y=(P.y|0)+b;
    if(map[Y][X]!==0)continue;
    let v=1e9;
    for(const o of th)v=Math.min(v,Math.hypot(o.x-X-.5,o.y-Y-.5));
    if(v>bv){bv=v;best=[X,Y]}
    const X2=X+a,Y2=Y+b;
    if(map[Y2]&&map[Y2][X2]===0){
      let v2=1e9;
      for(const o of th)v2=Math.min(v2,Math.hypot(o.x-X2-.5,o.y-Y2-.5));
      if(v2>bv){bv=v2;best=[X2,Y2]}

  }
  if(!best||bv<.85)return false;

  aiDodgeCd=.15;flash('Esquive !');beep(320,.15,.08,'square');

}
function aiStep(dt){
  aiCd-=dt;aiDodgeCd-=dt;
  const th=aiThreats();
  let near=null,nd=1e9,mmon=null,md=1e9;
  for(const m of th){
    const d=Math.hypot(m.x-P.x,m.y-P.y);
    if(d<nd){nd=d;near=m}
    if(m.t=='M'&&d<md){md=d;mmon=m}
  }
  if(hidden){
    aiHt-=dt;
    let out=true;
    for(const m of th){const d=Math.hypot(m.x-P.x,m.y-P.y);if(m.t=='V'?d<7.2&&d>2.5:d<2.6)out=false;if(m.t=='V'&&d<=2.5)out=true}

  }
  const whd=items.find(it=>!it.gone&&it.t=='W'&&Math.hypot(it.x-P.x,it.y-P.y)<1.5);
  if(near&&nd<4.5&&whd&&aiSafeHide(whd,th)){
    hidden=whd;P.x=whd.x;P.y=whd.y;aiHt=near.t=='V'?25:12;flash('L\u2019IA se cache.');return;

function render(t){

addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='e'){if(!e.repeat)interact()}else if(k=='f'){if(!e.repeat)toggleLamp()}else if(k=='i'){if(!e.repeat&&state=='play'){ai=!ai;flash(ai?'IA activ\u00e9e. Elle joue \u00e0 ta place.':'IA d\u00e9sactiv\u00e9e.')}}else if(KM[k]){keys[KM[k]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key.toLowerCase()];if(k)keys[k]=0});
document.querySelectorAll('#tc button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(k=='e')interact();else if(k=='t')toggleLamp();else keys[k]=1});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(k!='e')keys[k]=0}));
});
$('pv').onclick=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();newGame();state='play';ov();san=0;startCine()};
$('go').onclick=()=>{
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state=='suspended')AC.resume();
  if(state=='note'){interact();return}
  ai=false;newGame();state='play';ov();
};
$('aib').onclick=()=>{
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state=='suspended')AC.resume();
  if(state=='note'){interact();return}
  ai=true;newGame();state='play';ov();flash('L\u2019IA prend le contr\u00f4le.');
};

/* ---------- boucle ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state=='play')update(dt);else if(state=='cine')cine(dt);
  render(ts/1000);hud();requestAnimationFrame(loop);
}
newGame();
